[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgeit-edge-simulator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "numpy>=1.26", "scipy>=1.11", "pillow>=10", "imagehash>=4.3"]

[tool.setuptools]
packages = ["simulator"]
