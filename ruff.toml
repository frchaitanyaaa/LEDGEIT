target-version = "py311"
line-length = 120
extend-exclude = [".venv", "node_modules", "contracts", "apps/web"]

[lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP017", "B905", "E501"]  # timezone.utc readability; zip strict noise; formatter owns line length

[lint.isort]
known-first-party = ["ledgeit_proof", "ledgeit_api", "ai_inspector", "simulator", "anchor_worker", "tamper_lab"]
