name: ledgeit

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://ledgeit:ledgeit@postgres:5432/ledgeit
  TAMPER_DATABASE_URL: postgresql+psycopg://ledgeit:ledgeit@postgres:5432/ledgeit
  # Demo: evidence on a docker volume (no MinIO). For S3/Object Lock use STORAGE_BACKEND=s3 + a MinIO service.
  STORAGE_BACKEND: local
  STORAGE_DIR: /data/evidence
  CHAIN: ${CHAIN:-local}
  RPC_URL_LOCAL: http://hardhat:8545
  RPC_URL_AMOY: ${RPC_URL_AMOY:-https://rpc-amoy.polygon.technology}
  ANCHOR_PRIVATE_KEY: ${ANCHOR_PRIVATE_KEY:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
  CONTRACT_ADDRESS: ${CONTRACT_ADDRESS:-}
  JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5173}

services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: ledgeit, POSTGRES_PASSWORD: ledgeit, POSTGRES_DB: ledgeit }
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgeit"]
      interval: 3s
      retries: 20

  hardhat:
    build: ../contracts
    ports: ["8545:8545"]

  # One-shot bootstrap: migrate, seed demo data + device keys, deploy the anchor contract.
  # Everything else waits for it to finish, so `docker compose up` needs no manual steps.
  init:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    image: ledgeit-api
    environment: *app-env
    command:
      - sh
      - -c
      - >
        python -m ledgeit_api.db.migrate &&
        python -m ledgeit_api.db.seed &&
        { [ "$$CHAIN" != "local" ] || python -c "from ledgeit_api.chain.client import ensure_local_deployment as d; print('anchor contract', d())"; }
    volumes:
      - ../contracts/deployments:/app/contracts/deployments
      - ../services/edge-simulator/keys:/app/services/edge-simulator/keys
      - ../services/ai-inspector/models:/app/services/ai-inspector/models:ro
    depends_on:
      postgres: { condition: service_healthy }
      hardhat: { condition: service_started }
    restart: "no"

  api:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    image: ledgeit-api
    environment: *app-env
    ports: ["8000:8000"]
    volumes:
      - ../contracts/deployments:/app/contracts/deployments
      - ../services/edge-simulator/keys:/app/services/edge-simulator/keys
      - ../services/ai-inspector/models:/app/services/ai-inspector/models:ro
      - evidence:/data/evidence
    depends_on:
      postgres: { condition: service_healthy }
      init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 3s
      retries: 30
    restart: unless-stopped

  anchor-worker:
    build: { context: .., dockerfile: services/anchor-worker/Dockerfile }
    environment: *app-env
    volumes: ["../contracts/deployments:/app/contracts/deployments"]
    depends_on:
      api: { condition: service_healthy }
      hardhat: { condition: service_started }
    restart: unless-stopped

  ai-inspector:
    build: { context: .., dockerfile: services/ai-inspector/Dockerfile }
    environment: { MODEL_BACKEND: "${MODEL_BACKEND:-stub}" }
    ports: ["8001:8001"]
    volumes: ["../services/ai-inspector/models:/svc/models"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8001/health')"]
      interval: 3s
      retries: 30
    restart: unless-stopped

  # Two simulated edge cameras stream signed inspections forever (set --count N to limit).
  edge-simulator-a:
    build: { context: .., dockerfile: services/edge-simulator/Dockerfile }
    command: ["--device", "CAM-A-01", "--count", "0", "--rate", "0.5"]
    environment: &sim-env { API_URL: "http://api:8000", AI_INSPECTOR_URL: "http://ai-inspector:8001" }
    volumes: ["../services/edge-simulator/keys:/app/services/edge-simulator/keys:ro"]
    depends_on:
      api: { condition: service_healthy }
      ai-inspector: { condition: service_healthy }
    restart: unless-stopped

  edge-simulator-b:
    build: { context: .., dockerfile: services/edge-simulator/Dockerfile }
    command: ["--device", "CAM-B-01", "--count", "0", "--rate", "0.5"]
    environment: *sim-env
    volumes: ["../services/edge-simulator/keys:/app/services/edge-simulator/keys:ro"]
    depends_on:
      api: { condition: service_healthy }
      ai-inspector: { condition: service_healthy }
    restart: unless-stopped

  web:
    build: { context: .., dockerfile: apps/web/Dockerfile }
    ports: ["5173:80"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  evidence:
